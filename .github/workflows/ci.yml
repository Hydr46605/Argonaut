name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (format, detekt, unit tests, lint, APKs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Argonaut
        uses: actions/checkout@v4

      # Argonaut builds against the latest local Argos via a composite build.
      # The sibling checkout must exist before Gradle configures the build.
      # ARGOS_CHECKOUT_TOKEN is only needed while Argos is private; once public
      # (or same-repo), the fallback github.token is enough.
      - name: Checkout Argos (sibling composite build)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Argos
          path: Argos
          token: ${{ secrets.ARGOS_CHECKOUT_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Local CI gate
        run: ./gradlew verifyAll --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: argonaut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload detekt report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: ignore
